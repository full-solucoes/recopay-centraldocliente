name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - name: Impedir artefatos e segredos comuns
        shell: bash
        run: |
          forbidden="$(git ls-files | grep -E '(^|/)(\.env($|\.)|dist/|node_modules/)|\.(pfx|p12|pem|key|sql|bak|xlsx?)$' | grep -vE '(^|/)\.env(\.[^.]+)?\.example$' || true)"
          test -z "$forbidden"
          ! git grep -IEn '(rpk_|rcu_|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|password\s*=|connectionstring)' -- . ':!package-lock.json'
