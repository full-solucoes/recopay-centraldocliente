name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - name: Impedir artefatos e segredos comuns
        shell: bash
        run: |
          forbidden="$(git ls-files | grep -E '(^|/)(\.env($|\.)|dist/|node_modules/)|\.(pfx|p12|pem|key|sql|bak|xlsx?)$' | grep -vE '(^|/)\.env(\.[^.]+)?\.example$' || true)"
          test -z "$forbidden"
          # Chaves completas; mencionar o prefixo na documentacao nao e um segredo.
          # Senhas e demais credenciais continuam verificadas pelo Gitleaks.
          ! git grep -IEn '((rpk|rcu)_[A-Za-z0-9_-]{32,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' -- . ':!package-lock.json'
